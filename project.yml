name: BuurtHub
options:
  bundleIdPrefix: app.lrvdlinden
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.6

settings:
  base:
    DEVELOPMENT_TEAM: EU3UY476T6
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"

targets:
  BuurtHub:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    deploymentTarget: "17.0"
    sources:
      - path: BuurtHub
    dependencies:
      - package: Supabase
    entitlements:
      path: BuurtHub/BuurtHub.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: BuurtHub/Info.plist
      properties:
        CFBundleDisplayName: BuurtHub
        LSApplicationCategoryType: public.app-category.social-networking
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: BuurtHub uses Face ID to lock the app.
        CFBundleURLTypes:
          - CFBundleURLName: app.lrvdlinden.buurthub
            CFBundleURLSchemes: [buurthub]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lrvdlinden.buurthub
        INFOPLIST_KEY_CFBundleDisplayName: BuurtHub
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_HARDENED_RUNTIME: YES
